<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trivia Quiz</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.quiz-container{background:#1e293b;border-radius:16px;padding:40px;max-width:600px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
h1{font-size:28px;margin-bottom:8px;text-align:center}.subtitle{color:#94a3b8;text-align:center;margin-bottom:24px;font-size:14px}
.score-bar{display:flex;justify-content:space-between;margin-bottom:24px;padding:12px 16px;background:#334155;border-radius:8px;font-size:14px}
.score-bar span{color:#38bdf8}.question-num{color:#f472b6}
.question{font-size:20px;font-weight:600;margin-bottom:20px;line-height:1.4}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:#334155;border:2px solid #475569;border-radius:10px;padding:14px 18px;cursor:pointer;font-size:16px;color:#e2e8f0;transition:all .2s;text-align:left;width:100%}
.option:hover{border-color:#38bdf8;background:#1e3a5f}
.option.correct{border-color:#22c55e;background:rgba(34,197,94,0.15);color:#22c55e}
.option.wrong{border-color:#ef4444;background:rgba(239,68,68,0.15);color:#ef4444}
.option:disabled{cursor:default}
.next-btn{display:none;margin-top:20px;width:100%;padding:14px;background:#38bdf8;color:#0f172a;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.next-btn:hover{background:#7dd3fc}
.result{text-align:center}.result h2{font-size:32px;margin-bottom:12px}.result p{color:#94a3b8;margin-bottom:24px;font-size:18px}
.result .pct{color:#38bdf8;font-size:48px;font-weight:800;display:block;margin:16px 0}
.restart-btn{padding:14px 32px;background:#38bdf8;color:#0f172a;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
</style></head><body><div class="quiz-container"><h1>Trivia Quiz</h1><p class="subtitle">10 questions — how many can you get right?</p>
<div class="score-bar"><span id="score">Score: 0</span><span class="question-num" id="qnum">Q: 0/10</span><span id="timer">15s</span></div>
<div id="quiz-area"></div></div>
<script>
const Q=[{q:"What planet is known as the Red Planet?",o:["Mars","Venus","Jupiter","Saturn"],a:0},{q:"What is the chemical symbol for gold?",o:["Go","Au","Ag","Gd"],a:1},{q:"Which language has the most native speakers?",o:["English","Spanish","Mandarin","Hindi"],a:2},{q:"What year did the Titanic sink?",o:["1905","1912","1918","1923"],a:1},{q:"What is the largest organ in the human body?",o:["Liver","Brain","Skin","Heart"],a:2},{q:"Which country invented pizza?",o:["Greece","Italy","France","Turkey"],a:1},{q:"Speed of light in km/s (approx)?",o:["150,000","300,000","450,000","600,000"],a:1},{q:"Who painted the Mona Lisa?",o:["Michelangelo","Da Vinci","Raphael","Caravaggio"],a:1},{q:"What is the smallest prime number?",o:["0","1","2","3"],a:2},{q:"Which element has atomic number 1?",o:["Helium","Lithium","Hydrogen","Carbon"],a:2}];
let cur=0,score=0,tmr=null,time=15;
function start(){cur=0;score=0;showQ()}
function showQ(){clearInterval(tmr);time=15;if(cur>=Q.length)return showResult();const q=Q[cur];
document.getElementById("score").textContent="Score: "+score;document.getElementById("qnum").textContent="Q: "+(cur+1)+"/"+Q.length;document.getElementById("timer").textContent=time+"s";
tmr=setInterval(()=>{time--;document.getElementById("timer").textContent=time+"s";if(time<=0){clearInterval(tmr);markAll();}},1000);
let h='<div class="question">'+q.q+'</div><div class="options">';q.o.forEach((o,i)=>{h+='<button class="option" onclick="pick('+i+')">'+o+'</button>'});
h+='</div><button class="next-btn" id="nextbtn" onclick="next()">Next →</button>';document.getElementById("quiz-area").innerHTML=h}
function pick(i){clearInterval(tmr);const q=Q[cur],opts=document.querySelectorAll(".option");opts.forEach(o=>o.disabled=true);
if(i===q.a){score++;opts[i].classList.add("correct");document.getElementById("score").textContent="Score: "+score}else{opts[i].classList.add("wrong");opts[q.a].classList.add("correct")}
document.getElementById("nextbtn").style.display="block"}
function markAll(){const opts=document.querySelectorAll(".option");opts.forEach(o=>o.disabled=true);opts[Q[cur].a].classList.add("correct");document.getElementById("nextbtn").style.display="block"}
function next(){cur++;showQ()}
function showResult(){const pct=Math.round(score/Q.length*100);document.getElementById("quiz-area").innerHTML='<div class="result"><h2>Quiz Complete!</h2><span class="pct">'+pct+'%</span><p>'+score+' out of '+Q.length+' correct</p><button class="restart-btn" onclick="start()">Play Again</button></div>';document.getElementById("score").textContent="Score: "+score;document.getElementById("qnum").textContent="Done!";document.getElementById("timer").textContent="--"}
start()
</script></body></html>
